<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the surface before CSS/React paints; storage may be blocked.
      (() => {
        let saved;
        try { saved = localStorage.getItem('crosssignal.theme.v1'); } catch {}
        const theme = saved === 'daylight' || saved === 'after-hours' ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'after-hours' : 'daylight';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === 'after-hours' ? 'dark' : 'light';
      })();
    </script>
    <meta name="description" content="CrossSignal Culture Radio: music discovered from the films, games, books and places you love, via Qloo." />
    <title>CrossSignal · Culture Radio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
